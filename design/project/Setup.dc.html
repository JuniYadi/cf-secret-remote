<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create vault password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#131A22;background:#F4F6F8}
*{box-sizing:border-box}
a{color:#0B7A75}a:hover{color:#075E5A}
h1{font:700 28px/1.2 'Space Grotesk',sans-serif;margin:0}
h2{font:600 16px/1.3 'Space Grotesk',sans-serif;margin:0}
.card{background:#fff;border:1px solid #DDE2E8;border-radius:12px;padding:28px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:8px;border:1px solid #0B7A75;background:#0B7A75;color:#fff;font:600 15px 'Inter',sans-serif;text-decoration:none}
.btn:hover{background:#075E5A;color:#fff}
.btn:focus-visible,a:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #0B7A75;outline-offset:2px}
input[type=password]{font:14px 'Inter',sans-serif;min-height:48px;padding:0 12px;border:1px solid #C9D0D8;border-radius:8px;width:100%;background:#fff;color:#131A22}
label{font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;font-size:14px;color:#5B6672}
.step i{width:26px;height:26px;border-radius:99px;border:1px solid #C9D0D8;display:flex;align-items:center;justify-content:center;font:500 12px 'Inter',sans-serif;font-style:normal}
.step.done i{background:#17703F;border-color:#17703F;color:#fff}
.step.on{color:#131A22;font-weight:600}
.step.on i{background:#0B7A75;border-color:#0B7A75;color:#fff}
.li{display:flex;gap:14px;font-size:15px;line-height:1.5;color:#2B3541;align-items:flex-start}
.li b{flex:none;width:28px;height:28px;border-radius:99px;background:#E3F3F2;color:#075E5A;font:600 13px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center}
details{border-top:1px solid #EEF1F4;padding-top:14px}
summary{cursor:pointer;font-size:13.5px;color:#5B6672;min-height:32px;display:flex;align-items:center}
.code{margin-top:10px;border-radius:8px;background:#131A22;color:#E5E9EE;padding:12px;font:12px/1.7 'JetBrains Mono',monospace;word-break:break-all}
.lang{display:inline-flex;border:1px solid #C9D0D8;border-radius:8px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;min-height:36px;min-width:44px;font:600 12px 'Inter',sans-serif;color:#5B6672;cursor:pointer}
.lang button.on{background:#131A22;color:#fff}
</style>
</helmet>
<div style="min-height:820px;padding:32px;display:flex;flex-direction:column;gap:28px;align-items:center">
  <div style="width:100%;max-width:1000px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:8px;background:#0B7A75;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(1.1 -1.7)"><circle cx="17" cy="32" r="10" fill="none" stroke="#fff" stroke-width="7"/><circle cx="40" cy="32" r="5.2" fill="#fff"/><circle cx="53" cy="32" r="5.2" fill="#fff"/><circle cx="53" cy="45" r="4" fill="#fff"/></g></svg></div>
      <span style="font:700 18px 'Space Grotesk',sans-serif">cfs</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">
      <div class="step done"><i>✓</i>{{t.s1}}</div>
      <div class="step on"><i>2</i>{{t.s2}}</div>
      <div class="step"><i>3</i>{{t.s3}}</div>
      <div class="step"><i>4</i>{{t.s4}}</div>
      <div class="lang" role="group" aria-label="Language"><button class="{{enCls}}" onClick="{{setEn}}">EN</button><button class="{{idCls}}" onClick="{{setId}}">ID</button></div>
    </div>
  </div>

  <div style="width:100%;max-width:1000px;display:flex;flex-wrap:wrap;gap:20px;align-items:stretch">
    <div class="card" style="flex:1 1 440px;display:flex;flex-direction:column;gap:20px">
      <div>
        <h1>{{t.title}}</h1>
        <p style="margin:8px 0 0;color:#5B6672;font-size:15px;line-height:1.5">{{t.sub}}</p>
      </div>
      <div class="field"><label for="p1">{{t.pw}}</label><input id="p1" type="password" value="coffee-rain-bicycle-blue"></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="height:6px;border-radius:99px;background:#EEF1F4;overflow:hidden"><div style="width:82%;height:100%;background:#17703F"></div></div>
        <span style="font-size:13px;color:#17703F;font-weight:500">{{t.strong}}</span>
      </div>
      <div class="field"><label for="p2">{{t.pw2}}</label><input id="p2" type="password" value="coffee-rain-bicycle-blue"></div>
      <div style="display:flex;gap:12px;padding:14px 16px;border-radius:9px;background:#FFF4D6;color:#6B4700;font-size:14px;line-height:1.5">
        <svg style="flex:none;margin-top:2px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <span><b>{{t.warnB}}</b> {{t.warn}}</span>
      </div>
      <label style="display:flex;gap:10px;align-items:center;font-weight:500;min-height:44px"><input type="checkbox" checked style="width:20px;height:20px"> {{t.ack}}</label>
      <a class="btn" href="Setup-Recovery.dc.html">{{t.create}}</a>
    </div>

    <div class="card" style="flex:1 1 360px;display:flex;flex-direction:column;gap:20px;background:#FBFCFD">
      <h2>{{t.whatNext}}</h2>
      <div class="li"><b>1</b><span>{{t.n1}}</span></div>
      <div class="li"><b>2</b><span>{{t.n2}}</span></div>
      <div class="li"><b>3</b><span>{{t.n3}}</span></div>
      <details style="margin-top:auto">
        <summary>{{t.tech}}</summary>
        <div class="code">public_key: MFkwEwYHKoZI…<br>wrapped_private_key: {salt, iv, ct}<br>{{t.techNote}}</div>
      </details>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
state = { lang: 'en' };
componentDidMount() {
try { const s = localStorage.getItem('cfs-lang'); if (s) this.setState({ lang: s }); window.addEventListener('storage', (e) => { if (e.key === 'cfs-lang' && e.newValue) this.setState({ lang: e.newValue }); }); } catch (e) {}
}
setLang(l) { this.setState({ lang: l }); try { localStorage.setItem('cfs-lang', l); } catch (e) {} }
renderVals() {
const L = this.state.lang; const d = (en, id) => (L === 'id' ? id : en);
return {
enCls: L === 'en' ? 'on' : '', idCls: L === 'id' ? 'on' : '',
setEn: () => this.setLang('en'), setId: () => this.setLang('id'),
t: {
s1: d('Sign in', 'Masuk'), s2: d('Vault password', 'Vault password'), s3: d('Recovery key', 'Kunci pemulihan'), s4: d('Done', 'Selesai'),
title: d('Create your vault password', 'Buat vault password-mu'),
sub: d('This password locks your personal key. You’ll enter it each time you open the vault. It’s different from your work login.', 'Password ini mengunci kunci pribadimu. Kamu memasukkannya setiap kali membuka vault. Ini berbeda dari login kerjamu.'),
pw: d('Vault password', 'Vault password'), pw2: d('Type it again', 'Ketik ulang'),
strong: d('Strong: four random words', 'Kuat: empat kata acak'),
warnB: d('We can’t reset this password.', 'Kami tidak bisa mereset password ini.'),
warn: d('If you forget it, an admin has to give you access again. Save it in a password manager.', 'Kalau lupa, admin harus memberimu akses lagi. Simpan di password manager.'),
ack: d('I understand and I’ve saved it', 'Saya mengerti dan sudah menyimpannya'),
create: d('Create my vault', 'Buat vault saya'),
whatNext: d('What happens next', 'Apa yang terjadi berikutnya'),
n1: d('Your browser makes a personal key, just for you.', 'Browsermu membuat kunci pribadi, khusus untukmu.'),
n2: d('That key is locked with your vault password.', 'Kunci itu dikunci dengan vault password-mu.'),
n3: d('Only the locked key is saved on our server. Your password never leaves your device.', 'Hanya kunci yang sudah terkunci yang disimpan di server. Passwordmu tidak pernah keluar dari perangkat.'),
tech: d('Technical details', 'Detail teknis'),
techNote: d('Never sent: your password, your unlocked key.', 'Tidak pernah dikirim: passwordmu, kunci yang sudah terbuka.')
}
};
}
}
</script>
</body>
</html>
