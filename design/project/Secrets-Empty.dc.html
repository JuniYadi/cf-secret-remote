<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secrets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#131A22;background:#F4F6F8}
*{box-sizing:border-box}
a{color:#0B7A75}a:hover{color:#075E5A}
.app{display:flex;flex-wrap:wrap;min-height:820px;width:100%}
.side{flex:0 0 244px;background:#fff;border-right:1px solid #DDE2E8;padding:20px 14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:32px;height:32px;border-radius:8px;background:#0B7A75;display:flex;align-items:center;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:7px;color:#131A22;text-decoration:none;font-size:15px;min-height:44px}
.nav a:hover{background:#F0F3F6;color:#131A22}
.nav a.on{background:#E3F3F2;color:#075E5A;font-weight:600}
.me{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #DDE2E8;border-radius:9px;text-decoration:none;color:#131A22}
.ava{width:32px;height:32px;border-radius:99px;background:#131A22;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.lang{display:inline-flex;border:1px solid #C9D0D8;border-radius:8px;overflow:hidden;background:#fff;align-self:flex-start}
.lang button{border:0;background:none;min-height:36px;min-width:44px;font:600 12px 'Inter',sans-serif;color:#5B6672;cursor:pointer}
.lang button.on{background:#131A22;color:#fff}
.main{flex:999 1 640px;min-width:0;padding:24px 32px 40px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font:700 28px/1.2 'Space Grotesk',sans-serif;margin:0}
h2{font:600 17px/1.3 'Space Grotesk',sans-serif;margin:0}
.card{background:#fff;border:1px solid #DDE2E8;border-radius:12px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #0B7A75;background:#0B7A75;color:#fff;font:600 14px 'Inter',sans-serif;text-decoration:none}
.btn:hover{background:#075E5A;color:#fff}
.btn.ghost{background:#fff;color:#131A22;border-color:#C9D0D8}
.btn.ghost:hover{background:#F0F3F6;color:#131A22}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #0B7A75;outline-offset:2px}
.start{flex:1 1 240px;padding:20px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:#131A22;border:1px solid #DDE2E8;border-radius:12px;background:#fff}
.start:hover{border-color:#0B7A75;color:#131A22}
.start .ic{width:40px;height:40px;border-radius:10px;background:#E3F3F2;color:#075E5A;display:flex;align-items:center;justify-content:center}
.start b{font-size:15.5px}
.start span{font-size:14px;color:#5B6672;line-height:1.5}
.num{display:inline-flex;width:22px;height:22px;border-radius:99px;background:#131A22;color:#fff;font:600 12px 'Inter',sans-serif;align-items:center;justify-content:center;margin-right:8px}
</style>
</helmet>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(1.1 -1.7)"><circle cx="17" cy="32" r="10" fill="none" stroke="#fff" stroke-width="7"/><circle cx="40" cy="32" r="5.2" fill="#fff"/><circle cx="53" cy="32" r="5.2" fill="#fff"/><circle cx="53" cy="45" r="4" fill="#fff"/></g></svg></div><div><div style="font:700 17px 'Space Grotesk',sans-serif;line-height:1">cfs</div><div style="font-size:12px;color:#5B6672">myorg</div></div></div>
    <nav class="nav" aria-label="Main">
      <a class="on" href="Secrets.dc.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg>{{t.navSecrets}}</a>
      <a href="Keyring.dc.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.9 M16 3.1a4 4 0 0 1 0 7.8"/></svg>{{t.navGroups}}</a>
      <a href="Policies.dc.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>{{t.navPerms}}</a>
      <a href="AppRoles.dc.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6 M12 19h8"/></svg>{{t.navApps}}</a>
      <a href="Audit.dc.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01"/></svg>{{t.navActivity}}</a>
      <a href="Settings.dc.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7 M4 10V3 M12 21v-9 M12 8V3 M20 21v-5 M20 12V3 M1 14h6 M9 8h6 M17 16h6"/></svg>{{t.navSettings}}</a>
    </nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
      <div class="lang" role="group" aria-label="Language"><button class="{{enCls}}" onClick="{{setEn}}">EN</button><button class="{{idCls}}" onClick="{{setId}}">ID</button></div>
      <a class="me" href="Devices.dc.html"><div class="ava">A</div><div style="min-width:0"><div style="font-size:14px;font-weight:600">Alice Wijaya</div><div style="font-size:12.5px;color:#5B6672">{{t.admin}}</div></div></a>
      <div style="display:flex;gap:8px"><a href="Unlock.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:36px;border:1px solid #C9D0D8;border-radius:8px;color:#131A22;text-decoration:none;font-size:13px;font-weight:600;background:#fff">{{t.lock}}</a><a href="Main.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:36px;border:1px solid #C9D0D8;border-radius:8px;color:#131A22;text-decoration:none;font-size:13px;font-weight:600;background:#fff">{{t.signout}}</a></div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <h1>{{t.navSecrets}}</h1>
        <p style="margin:6px 0 0;color:#5B6672;font-size:15px;line-height:1.5">{{t.sub}}</p>
      </div>
    </div>

    <div class="card" style="padding:40px 32px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center">
      <div style="width:56px;height:56px;border-radius:99px;background:#E3F3F2;color:#075E5A;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <h2>{{t.title}}</h2>
      <p style="margin:0;color:#5B6672;font-size:15px;max-width:52ch;line-height:1.5">{{t.lead}}</p>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:16px">
      <a class="start" href="Group-New.dc.html"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></div><b><span class="num">1</span>{{t.c1}}</b><span>{{t.c1s}}</span></a>
      <a class="start" href="Secret-New.dc.html"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg></div><b><span class="num">2</span>{{t.c2}}</b><span>{{t.c2s}}</span></a>
      <a class="start" href="Import.dc.html"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12 M7 10l5 5 5-5 M5 21h14"/></svg></div><b><span class="num">2</span>{{t.c3}}</b><span>{{t.c3s}}</span></a>
      <a class="start" href="Invite.dc.html"><div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z M4 7l8 6 8-6"/></svg></div><b><span class="num">3</span>{{t.c4}}</b><span>{{t.c4s}}</span></a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
state = { lang: 'en' };
componentDidMount() {
try { const s = localStorage.getItem('cfs-lang'); if (s) this.setState({ lang: s }); window.addEventListener('storage', (e) => { if (e.key === 'cfs-lang' && e.newValue) this.setState({ lang: e.newValue }); }); } catch (e) {}
}
setLang(l) { this.setState({ lang: l }); try { localStorage.setItem('cfs-lang', l); } catch (e) {} }
renderVals() {
const L = this.state.lang; const d = (en, id) => (L === 'id' ? id : en);
return {
enCls: L === 'en' ? 'on' : '', idCls: L === 'id' ? 'on' : '',
setEn: () => this.setLang('en'), setId: () => this.setLang('id'),
t: {
navSecrets: d('Secrets', 'Secret'), navGroups: d('Groups', 'Grup'), navPerms: d('Permissions', 'Izin'), navApps: d('Apps & bots', 'Aplikasi & bot'), navActivity: d('Activity', 'Aktivitas'), navSettings: d('Settings', 'Pengaturan'),
admin: d('Admin', 'Admin'), lock: d('Lock vault', 'Kunci vault'), signout: d('Sign out', 'Keluar'),
sub: d('You can see the names. The values open only for people in the right group.', 'Nama terlihat oleh semua. Isinya hanya terbuka untuk orang di grup yang tepat.'),
title: d('No secrets yet', 'Belum ada secret'),
lead: d('Your vault is ready. Start by creating a group, then add your first secret. About three minutes.', 'Vault-mu siap. Mulai dengan membuat grup, lalu tambahkan secret pertamamu. Sekitar tiga menit.'),
c1: d('Create a group', 'Buat grup'), c1s: d('Decide who can open your secrets. You’re the first member.', 'Tentukan siapa yang bisa membuka secret-mu. Kamu anggota pertamanya.'),
c2: d('Add a secret', 'Tambah secret'), c2s: d('Start from scratch and add items one by one.', 'Mulai dari nol dan tambah item satu per satu.'),
c3: d('Import a .env file', 'Impor file .env'), c3s: d('Already have one? Bring it in and review it first.', 'Sudah punya? Masukkan dan tinjau dulu.'),
c4: d('Invite a teammate', 'Undang anggota'), c4s: d('Let them run the project without sharing any passwords.', 'Biarkan mereka menjalankan proyek tanpa membagikan password.')
}
};
}
}
</script>
</body>
</html>
