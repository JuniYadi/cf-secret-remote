name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run scripts/check-worker-node-imports.ts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:cli

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @cfs/extension test
      - run: bun run --filter @cfs/extension build

  # ADR 26: the end-to-end script boots wrangler dev with a fresh local D1 and drives the real CLI.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run e2e

  # ADR 26: the shared test vectors in a real Chromium page.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/core
      - run: bun run test:browser
      - run: CFS_BROWSER_SMOKE=1 bun run e2e

  # Informational: reports ADR status drift and PR coverage. Never fails (continue-on-error + exit 0).
  adr-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun run adr:check
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
