name: release
# ADR 25: on a version tag, build the CLI for five targets and the Worker bundle, checksum them,
# attest their build provenance, and attach everything to a GitHub release.
# Asset names are a contract with `cfs upgrade` and `cfs deploy` (cfs-<os>-<arch>, SHA256SUMS).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  cli:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: bun-darwin-arm64, asset: cfs-darwin-arm64 }
          - { target: bun-darwin-x64, asset: cfs-darwin-x64 }
          - { target: bun-linux-x64, asset: cfs-linux-x64 }
          - { target: bun-linux-arm64, asset: cfs-linux-arm64 }
          - { target: bun-windows-x64, asset: cfs-windows-x64.exe }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compile ${{ matrix.asset }}
        run: bun build --compile --target=${{ matrix.target }} apps/cli/src/index.ts --outfile dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  worker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build worker-bundle.tgz
        env:
          CFS_VERSION: ${{ github.ref_name }}
        run: bun run bundle:worker
      - name: Archive web dist
        run: tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf dist/web-dist.tgz -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist.tgz
          path: dist/web-dist.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle.tgz
          path: dist/worker-bundle.tgz
          if-no-files-found: error

  publish:
    needs: [cli, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Checksums (sha256sum format)
        working-directory: dist/release
        run: |
          set -euo pipefail
          sha256sum cfs-* worker-bundle.tgz web-dist.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/release/*"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/release/cfs-* dist/release/worker-bundle.tgz dist/release/web-dist.tgz dist/release/SHA256SUMS
